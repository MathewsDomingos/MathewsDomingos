<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Mateus Domingos — Observability Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B131F"/>
      <stop offset="55%" stop-color="#0E1826"/>
      <stop offset="100%" stop-color="#0B131F"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#40E69A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#40E69A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#40E69A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40E69A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#40E69A" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#16202E" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="880" height="200" rx="14"/>
    </clipPath>

    <path id="wave" d="M0,150 L60,150 78,132 96,158 112,140 138,141 152,118 168,152 186,146 214,147
                       236,124 252,155 270,138 300,139 318,150 344,128 362,156 380,143 410,144
                       430,120 448,152 466,136 500,137 520,148 546,126 564,157 584,141 618,142
                       640,122 658,154 676,138 712,139 732,150 758,130 776,155 796,142 880,143"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="200" fill="url(#bg)"/>
    <rect width="880" height="200" fill="url(#grid)" opacity="0.55"/>

    <!-- varredura estilo radar -->
    <rect x="-260" y="0" width="260" height="200" fill="url(#sweep)">
      <animate attributeName="x" values="-260;880" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- sparkline de fundo -->
    <use href="#wave" fill="none" stroke="url(#fade)" stroke-width="24" opacity="0.5"/>
    <use href="#wave" fill="none" stroke="#40E69A" stroke-width="1.6" stroke-linejoin="round"
         stroke-dasharray="1400" stroke-dashoffset="1400" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.6s" fill="freeze"/>
    </use>

    <circle r="3.5" fill="#40E69A">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#wave"/>
      </animateMotion>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- barra de acento -->
    <rect x="0" y="0" width="4" height="200" fill="#40E69A" opacity="0.9"/>

    <!-- identidade -->
    <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace">
      <text x="38" y="52" fill="#4E6076" font-size="11.5" letter-spacing="3.6">/ SISTEMA EM PRODUÇÃO</text>

      <text x="38" y="98" fill="#E8EEF5" font-size="38" font-weight="700" letter-spacing="1.5">
        MATEUS DOMINGOS<tspan fill="#40E69A">_</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
      </text>

      <text x="40" y="124" fill="#7A8CA3" font-size="12.5" letter-spacing="2">
        OBSERVABILIDADE · AUTOMAÇÃO · ZABBIX / GRAFANA / N8N
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/>
      </text>

      <!-- chips -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>
        <rect x="40" y="146" width="118" height="24" rx="12" fill="#16202E" stroke="#22303F"/>
        <text x="56" y="162" fill="#9FB2C6" font-size="10.5" letter-spacing="1.2">ZCU CERTIFIED</text>
        <rect x="166" y="146" width="150" height="24" rx="12" fill="#16202E" stroke="#22303F"/>
        <text x="182" y="162" fill="#9FB2C6" font-size="10.5" letter-spacing="1.2">VAREJO · RODOVIAS</text>
        <rect x="324" y="146" width="134" height="24" rx="12" fill="#16202E" stroke="#22303F"/>
        <text x="340" y="162" fill="#9FB2C6" font-size="10.5" letter-spacing="1.2">OPEN SOURCE</text>
      </g>

      <!-- bloco de status à direita -->
      <g transform="translate(662, 40)">
        <rect x="0" y="0" width="184" height="76" rx="10" fill="#121A26" stroke="#22303F"/>
        <circle cx="20" cy="26" r="5" fill="#40E69A">
          <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="26" r="5" fill="none" stroke="#40E69A" stroke-width="1.5">
          <animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="36" y="30" fill="#40E69A" font-size="13" font-weight="700" letter-spacing="1.4">OPERATIONAL</text>
        <text x="20" y="54" fill="#4E6076" font-size="10" letter-spacing="1.6">SEVERITY</text>
        <rect x="86" y="46" width="16" height="9" rx="2" fill="#40E69A" opacity="0.85"/>
        <rect x="106" y="46" width="16" height="9" rx="2" fill="#FFC14D" opacity="0.28"/>
        <rect x="126" y="46" width="16" height="9" rx="2" fill="#FF6A4E" opacity="0.28"/>
        <rect x="146" y="46" width="16" height="9" rx="2" fill="#8E44AD" opacity="0.2"/>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="879" height="199" rx="14" fill="none" stroke="#1D2A3A"/>
  </g>
</svg>
