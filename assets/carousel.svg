        <text x="40" y="207" fill="#7A8CA3" font-size="12.5">hora em hora: calcula % up/down do mês corrente e do</text>
        <text x="40" y="226" fill="#7A8CA3" font-size="12.5">anterior, com reset automático na virada. Exposto num</text>
        <text x="40" y="245" fill="#7A8CA3" font-size="12.5">card feito para telão de gerência.</text>
