        <text x="40" y="152" fill="#FFC14D" font-size="12.5" opacity="0.85">planilha entra, mapa sai</text>
        <text x="40" y="188" fill="#7A8CA3" font-size="12.5">Lê a planilha de inventário e emite o YAML de mapa</text>
        <text x="40" y="207" fill="#7A8CA3" font-size="12.5">pronto para importar no Zabbix: layout simétrico,</text>
