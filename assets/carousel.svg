        <text x="40" y="207" fill="#7A8CA3" font-size="12.5">frontend. Um exporta o inventário de coletas de um host</text>
        <text x="40" y="226" fill="#7A8CA3" font-size="12.5">para planilha; outro traz os chamados do GLPI para</text>
        <text x="40" y="245" fill="#7A8CA3" font-size="12.5">dentro da tela de problemas.</text>
