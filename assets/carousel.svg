        <text x="40" y="152" fill="#40E69A" font-size="12.5" opacity="0.85">alerta que chega onde a equipe realmente olha</text>
        <text x="40" y="188" fill="#7A8CA3" font-size="12.5">Webhook nativo do Zabbix que entrega o problema no</text>
        <text x="40" y="207" fill="#7A8CA3" font-size="12.5">WhatsApp com o screenshot do gráfico anexado. O técnico</text>
        <text x="40" y="226" fill="#7A8CA3" font-size="12.5">vê a curva antes de abrir o notebook.</text>
