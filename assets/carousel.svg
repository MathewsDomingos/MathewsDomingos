        <text x="40" y="128" fill="#E8EEF5" font-size="21" font-weight="700">shorts-ai-mvp</text>
        <text x="40" y="152" fill="#A78BFA" font-size="12.5" opacity="0.85">vídeo curto gerado do início ao fim por pipeline</text>
        <text x="40" y="188" fill="#7A8CA3" font-size="12.5">Baixa a fonte com yt-dlp, transcreve local com</text>
        <text x="40" y="207" fill="#7A8CA3" font-size="12.5">faster-whisper, pontua os melhores trechos com a Claude</text>
        <text x="40" y="226" fill="#7A8CA3" font-size="12.5">API e renderiza em 9:16 com legenda ASS via FFmpeg.</text>
