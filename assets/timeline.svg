<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Histórico profissional de Mateus Domingos">
  <!--
    COMO EDITAR: cada bloco <g class="cargo"> abaixo é uma experiência.
    Para trocar de emprego, duplique um bloco, ajuste o transform="translate(0, Y)"
    (os Y são 78, 168 e 250) e edite os textos. O ponto verde pulsante marca o cargo atual.
  -->
  <defs>
    <pattern id="tg" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 L0 0 0 22" fill="none" stroke="#141E2B" stroke-width="1"/>
    </pattern>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#40E69A" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#2A6E52" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1D2A3A" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="tc"><rect width="880" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#tc)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace">
    <rect width="880" height="340" fill="#0B131F"/>
    <rect width="880" height="340" fill="url(#tg)" opacity="0.6"/>

    <rect x="0" y="0" width="880" height="52" fill="#121A26"/>
    <rect x="0" y="51" width="880" height="1" fill="#22303F"/>
    <rect x="0" y="0" width="4" height="52" fill="#40E69A"/>
    <text x="34" y="32" fill="#E8EEF5" font-size="13" font-weight="700" letter-spacing="2.4">HISTÓRICO PROFISSIONAL</text>
    <text x="846" y="32" fill="#3E5670" font-size="11" text-anchor="end">uptime acumulado: 3 anos +</text>

    <!-- trilho da linha do tempo -->
    <line x1="52" y1="78" x2="52" y2="300" stroke="url(#trail)" stroke-width="2"/>

    <!-- ============================ ATUAL ============================ -->
    <g transform="translate(0, 78)">
      <circle cx="52" cy="0" r="6" fill="#40E69A"/>
      <circle cx="52" cy="0" r="6" fill="none" stroke="#40E69A" stroke-width="1.5">
        <animate attributeName="r" values="6;16" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>

      <text x="82" y="-4" fill="#E8EEF5" font-size="16" font-weight="700">Analista de Monitoramento</text>
      <text x="82" y="18" fill="#40E69A" font-size="12.5">JLCP Tecnologia</text>
      <text x="82" y="38" fill="#5C7086" font-size="11">jul 2024 — o momento · tempo integral · remoto</text>
      <text x="82" y="58" fill="#7A8CA3" font-size="11.5">Ambientes Zabbix e Grafana ponta a ponta · dashboards customizados · automação com n8n</text>

      <rect x="742" y="-18" width="104" height="22" rx="11" fill="#16202E" stroke="#2A6E52"/>
      <text x="794" y="-3" fill="#40E69A" font-size="10" text-anchor="middle" letter-spacing="1">ATUAL</text>
    </g>

    <!-- ============================================================== -->
    <g transform="translate(0, 168)">
      <circle cx="52" cy="0" r="5" fill="#0B131F" stroke="#3E5670" stroke-width="2"/>

      <text x="82" y="-4" fill="#C7D4E2" font-size="15" font-weight="700">Analista de Monitoramento</text>
      <text x="82" y="18" fill="#7A8CA3" font-size="12.5">Eras Monitoramento</text>
      <text x="82" y="38" fill="#4E6076" font-size="11">jan 2024 — jun 2024 · tempo integral · remoto</text>
      <text x="82" y="58" fill="#5C7086" font-size="11.5">Instalação e configuração de Zabbix e Grafana · monitoramento de ativos de rede</text>
    </g>

    <!-- ============================================================== -->
    <g transform="translate(0, 250)">
      <circle cx="52" cy="0" r="5" fill="#0B131F" stroke="#3E5670" stroke-width="2"/>

      <text x="82" y="-4" fill="#C7D4E2" font-size="15" font-weight="700">Analista de Suporte <tspan fill="#4E6076" font-size="11" font-weight="400">· estágio</tspan></text>
      <text x="82" y="18" fill="#7A8CA3" font-size="12.5">Flowbix</text>
      <text x="82" y="38" fill="#4E6076" font-size="11">out 2022 — dez 2023 · onde tudo começou</text>
      <text x="82" y="58" fill="#5C7086" font-size="11.5">Resposta a alertas, investigação de causa raiz e políticas de monitoramento</text>
    </g>

    <rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="none" stroke="#1D2A3A"/>
  </g>
</svg>
